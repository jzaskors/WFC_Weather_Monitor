name: Sagamore check
# Manual diagnostic: Actions tab -> "Sagamore check" -> Run workflow.
# Prints the raw WeatherLink payload and the parsed observation. No email, no state change.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Confirm the module imports under its exact filename
        run: python -c "import sagamore; print('import OK:', sagamore.__file__)"
      - name: Fetch and parse the Sagamore feed
        run: python sagamore.py
