name: Conditions report (test email)
# Manual: Actions tab -> "Conditions report (test email)" -> Run workflow.
# Runs every real check and emails the full current picture, marked as a TEST.
# Changes no stored status, sends no texts, and is never counted as an alert.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Send to (leave blank for the normal alert list)"
        required: false
        default: ""
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run all checks and email the report
        env:
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASS:       ${{ secrets.SMTP_PASS }}
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:        ${{ inputs.to || secrets.EMAIL_TO }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_REPLY_TO:  ${{ secrets.EMAIL_REPLY_TO }}
          TEMPEST_TOKEN:   ${{ secrets.TEMPEST_TOKEN }}
          WU_API_KEY:      ${{ secrets.WU_API_KEY }}
        run: python monitor.py --report
