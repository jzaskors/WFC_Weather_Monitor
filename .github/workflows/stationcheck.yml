name: Station check
# Manual: Actions tab -> "Station check" -> Run workflow.
# Prints every station in sites/wfc.json side by side (wind, gust, direction,
# age), including ones switched off. Reads only: no email, no state change.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare every station
        env:
          TEMPEST_TOKEN: ${{ secrets.TEMPEST_TOKEN }}
          WU_API_KEY:    ${{ secrets.WU_API_KEY }}
        run: python monitor.py --stations
